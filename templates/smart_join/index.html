{% extends 'base.html' %}

{% block title %}Smart Join{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-5xl mx-auto bg-white/80 dark:bg-gray-800/60 backdrop-blur-xl rounded-2xl shadow-xl border border-gray-200/70 dark:border-gray-700/70">
        <div class="border-b border-gray-200/70 dark:border-gray-800 px-6 sm:px-10 py-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-semibold tracking-tight text-gray-900 dark:text-gray-50">Smart Join</h1>
            </div>
        </div>

        <!-- Main layout -->
        <div class="px-6 sm:px-10 py-8 space-y-8">
            <!-- File upload row -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Dataset 1 -->
                <div class="rounded-xl border border-gray-200/80 dark:border-gray-800 bg-gray-50/80 dark:bg-gray-900/60 p-4 sm:p-5 flex flex-col gap-4">
                    <div>
                        <p class="text-xs font-medium uppercase tracking-wide text-gray-500 dark:text-gray-400">Dataset 1</p>
                    </div>

                    <label class="group flex flex-col items-center justify-center gap-2 rounded-lg border border-dashed border-gray-300 dark:border-gray-700 bg-white/60 dark:bg-gray-900/80 px-3 py-4 cursor-pointer hover:border-emerald-400 hover:bg-emerald-50/60 dark:hover:bg-emerald-500/5 transition">
                        <div class="flex items-center gap-3">
                            <div class="flex h-9 w-9 items-center justify-center rounded-full bg-emerald-500/10 text-emerald-600 dark:text-emerald-400">
                                <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path fill-rule="evenodd" d="M10 2a.75.75 0 01.75.75V9h6.25a.75.75 0 010 1.5H10.75v6.25a.75.75 0 01-1.5 0V10.5H3a.75.75 0 010-1.5h6.25V2.75A.75.75 0 0110 2z" clip-rule="evenodd" />
                                </svg>
                            </div>
                            <div class="text-left">
                                <p class="text-xs font-medium text-gray-900 dark:text-gray-100">Select file</p>
                                <p id="file-1-label" class="text-[11px] text-gray-500 dark:text-gray-400 line-clamp-1">No file selected</p>
                            </div>
                        </div>
                        <input id="file-1" type="file" accept=".csv" class="sr-only">
                    </label>

                    <!-- Columns tags for dataset 1 -->
                    <div>
                        <div id="columns-1" class="flex flex-wrap gap-2 text-xs text-gray-500 dark:text-gray-500">
                        </div>
                    </div>
                </div>

                <!-- Dataset 2 -->
                <div class="rounded-xl border border-gray-200/80 dark:border-gray-800 bg-gray-50/80 dark:bg-gray-900/60 p-4 sm:p-5 flex flex-col gap-4">
                    <div>
                        <p class="text-xs font-medium uppercase tracking-wide text-gray-500 dark:text-gray-400">Dataset 2</p>
                    </div>

                    <label class="group flex flex-col items-center justify-center gap-2 rounded-lg border border-dashed border-gray-300 dark:border-gray-700 bg-white/60 dark:bg-gray-900/80 px-3 py-4 cursor-pointer hover:border-emerald-400 hover:bg-emerald-50/60 dark:hover:bg-emerald-500/5 transition">
                        <div class="flex items-center gap-3">
                            <div class="flex h-9 w-9 items-center justify-center rounded-full bg-sky-500/10 text-sky-600 dark:text-sky-400">
                                <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h4.382a2 2 0 001.447-.724L14 13h2a2 2 0 002-2V5a2 2 0 00-2-2H4zm5 4a1 1 0 011 1v1h1a1 1 0 110 2h-1v1a1 1 0 11-2 0v-1H7a1 1 0 010-2h1V8a1 1 0 011-1z" clip-rule="evenodd" />
                                </svg>
                            </div>
                            <div class="text-left">
                                <p class="text-xs font-medium text-gray-900 dark:text-gray-100">Select file</p>
                                <p id="file-2-label" class="text-[11px] text-gray-500 dark:text-gray-400 line-clamp-1">No file selected</p>
                            </div>
                        </div>
                        <input id="file-2" type="file" accept=".csv" class="sr-only">
                    </label>

                    <!-- Columns tags for dataset 2 -->
                    <div>
                        <div id="columns-2" class="flex flex-wrap gap-2 text-xs text-gray-500 dark:text-gray-500">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Options & Analysis -->
            <div class="grid grid-cols-1 lg:grid-cols-[2fr,1fr] gap-6 items-start">
                <!-- Matching options -->

                <div class="rounded-xl border border-gray-200/80 dark:border-gray-800 bg-gray-50/60 dark:bg-gray-950/60 p-4 sm:p-5 space-y-5">
                    <h3 class="text-sm font-semibold text-gray-900 dark:text-gray-50">Settings</h3>

                    <!-- Threshold options -->
                    <div class="space-y-2">
                        <p class="text-xs font-medium text-gray-700 dark:text-gray-300 flex items-center gap-2">
                            Threshold
                        </p>
                        <div class="flex flex-wrap gap-2" data-group="threshold">
                            <button type="button" class="option-chip" data-value="0.60">0.60</button>
                            <button type="button" class="option-chip is-selected" data-value="0.75">0.75</button>
                            <button type="button" class="option-chip" data-value="0.90">0.90</button>
                        </div>
                    </div>

                    <!-- Join type options -->
                    <div class="space-y-2">
                        <p class="text-xs font-medium text-gray-700 dark:text-gray-300">Join type</p>
                        <div class="flex flex-wrap gap-2" data-group="join-type">
                            <button type="button" class="option-chip is-selected" data-value="inner">Inner</button>
                            <button type="button" class="option-chip" data-value="left">Left</button>
                            <button type="button" class="option-chip" data-value="right">Right</button>
                            <button type="button" class="option-chip" data-value="outer">Outer</button>
                        </div>
                    </div>
                </div>

                <!-- Analysis action & preview -->
                <div class="rounded-xl border border-gray-200/80 dark:border-gray-800 bg-gradient-to-b from-gray-50/80 to-white/90 dark:from-gray-950/60 dark:to-gray-900/60 p-4 sm:p-5 flex flex-col gap-4">
                    <button id="btn-analysis" type="button" disabled
                        class="inline-flex items-center justify-center gap-2 rounded-full px-4 py-2.5 text-xs font-medium border border-transparent bg-emerald-500/80 text-white shadow-sm shadow-emerald-500/30 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-emerald-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500 focus-visible:ring-offset-2 focus-visible:ring-offset-gray-100 dark:focus-visible:ring-offset-gray-900 transition">
                        <svg id="btn-analysis-spinner" class="hidden h-3.5 w-3.5 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4zm5 4a1 1 0 011 1v1h1a1 1 0 110 2h-1v1a1 1 0 11-2 0v-1H7a1 1 0 010-2h1V8a1 1 0 011-1z" clip-rule="evenodd" />
                        </svg>
                        <span id="btn-analysis-text">Analysis</span>
                    </button>
                    <button id="btn-submit" type="button" disabled
                        class="inline-flex items-center justify-center gap-2 rounded-full px-4 py-2.5 text-xs font-medium border border-transparent bg-emerald-500/80 text-white shadow-sm shadow-emerald-500/30 disabled:opacity-50 disabled:cursor-not-allowed hover:bg-emerald-500 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500 focus-visible:ring-offset-2 focus-visible:ring-offset-gray-100 dark:focus-visible:ring-offset-gray-900 transition">
                        <svg id="btn-analysis-spinner" class="hidden h-3.5 w-3.5 animate-spin" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4zm5 4a1 1 0 011 1v1h1a1 1 0 110 2h-1v1a1 1 0 11-2 0v-1H7a1 1 0 010-2h1V8a1 1 0 011-1z" clip-rule="evenodd" />
                        </svg>
                        <span id="btn-submit-text">Submit</span>
                    </button>
                </div>
            </div>

            <div id="preview-section" class="mt-6">
                <div class="rounded-2xl border border-gray-200/80 dark:border-gray-800 bg-white/80 dark:bg-gray-950/70 p-4 sm:p-5 space-y-4">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                        <div class="space-y-1">
                            <p class="text-xs font-semibold text-gray-900 dark:text-gray-50">Preview</p>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            <button id="btn-download" type="button" disabled
                                class="inline-flex items-center justify-center gap-1.5 rounded-full px-4 py-2 text-[11px] font-medium border border-gray-200 dark:border-gray-700 bg-gray-50/80 dark:bg-gray-900/70 text-gray-700 dark:text-gray-200 disabled:opacity-40 disabled:cursor-not-allowed hover:border-emerald-400 hover:bg-emerald-50/80 dark:hover:bg-emerald-500/10 transition">
                                <svg class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path d="M3 14.25a.75.75 0 01.75-.75h12.5a.75.75 0 010 1.5H3.75a.75.75 0 01-.75-.75z" />
                                    <path d="M10 2.5a.75.75 0 01.75.75v7.638l2.116-2.116a.75.75 0 111.06 1.06l-3.5 3.5a.75.75 0 01-1.06 0l-3.5-3.5a.75.75 0 111.06-1.06l2.116 2.116V3.25A.75.75 0 0110 2.5z" />
                                </svg>
                                <span>Download CSV</span>
                            </button>
                        </div>
                    </div>

                    <div class="overflow-hidden rounded-xl border border-gray-200/80 dark:border-gray-800">
                        <div class="max-h-150 overflow-auto bg-white/80 dark:bg-gray-950/70">
                            <table class="min-w-full text-left text-[11px]">
                                <thead id="preview-thead" class="bg-gray-50/90 dark:bg-gray-900/80 text-gray-500 dark:text-gray-400">
                                    <tr>
                                        <th class="px-3 py-2 font-semibold">No data</th>
                                    </tr>
                                </thead>
                                <tbody id="preview-tbody" class="divide-y divide-gray-100 dark:divide-gray-800 text-gray-700 dark:text-gray-200">
                                    <tr>
                                        <td class="px-3 py-5 text-center text-[11px] text-gray-400 dark:text-gray-500">No data</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Inline script only for demo behaviour -->
    <script>
        (function () {
            const fileInput1 = document.getElementById('file-1');
            const fileInput2 = document.getElementById('file-2');
            const fileLabel1 = document.getElementById('file-1-label');
            const fileLabel2 = document.getElementById('file-2-label');
            const analysisBtn = document.getElementById('btn-analysis');
            const analysisText = document.getElementById('btn-analysis-text');
            const analysisSpinner = document.getElementById('btn-analysis-spinner');
            const columns1Container = document.getElementById('columns-1');
            const columns2Container = document.getElementById('columns-2');
            const submitBtn = document.getElementById('btn-submit');
            const submitText = document.getElementById('btn-submit-text');
            const downloadBtn = document.getElementById('btn-download');
            const previewThead = document.getElementById('preview-thead');
            const previewTbody = document.getElementById('preview-tbody');

            let hasAnalysis = false;
            let hasPreview = false;
            let df1Name = null;
            let df2Name = null;
            let currentCsvName = null;

            // Helper to get base URL for API endpoints relative to current page
            const basePath = window.location.pathname.replace(/smart-join\/?$/, '');
            const uploadUrl = basePath + 'smart-join/upload/';
            const runJoinUrl = basePath + 'smart-join/run-join/';

            function updateAnalysisButtonState() {
                const hasFile1 = fileInput1.files && fileInput1.files.length > 0;
                const hasFile2 = fileInput2.files && fileInput2.files.length > 0;
                analysisBtn.disabled = !(hasFile1 && hasFile2);
            }

            function createTag(label) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'tag-chip inline-flex items-center gap-1 rounded-md border border-gray-200 dark:border-gray-700 bg-white/90 dark:bg-gray-900/80 px-2.5 py-1 text-[11px] font-medium text-gray-700 dark:text-gray-200 hover:border-emerald-400 hover:bg-emerald-50/70 dark:hover:bg-emerald-500/10 transition';
                btn.setAttribute('data-selected', 'false');

                const spanLabel = document.createElement('span');
                spanLabel.textContent = label;

                const spanIcon = document.createElement('span');
                spanIcon.className = 'text-[13px] text-emerald-500';
                spanIcon.textContent = '+';

                btn.appendChild(spanLabel);
                btn.appendChild(spanIcon);

                btn.addEventListener('click', () => {
                    const isSelected = btn.getAttribute('data-selected') === 'true';
                    if (isSelected) {
                        btn.setAttribute('data-selected', 'false');
                        btn.className = 'tag-chip inline-flex items-center gap-1 rounded-md border border-gray-200 dark:border-gray-700 bg-white/90 dark:bg-gray-900/80 px-2.5 py-1 text-[11px] font-medium text-gray-700 dark:text-gray-200 hover:border-emerald-400 hover:bg-emerald-50/70 dark:hover:bg-emerald-500/10 transition';
                        spanIcon.textContent = '+';
                        spanIcon.className = 'text-[13px] text-emerald-500';
                    } else {
                        btn.setAttribute('data-selected', 'true');
                        btn.className = 'tag-chip inline-flex items-center gap-1 rounded-md border border-emerald-400/80 bg-emerald-50/80 dark:bg-emerald-500/15 px-2.5 py-1 text-[11px] font-semibold text-emerald-700 dark:text-emerald-300 shadow-xs';
                        spanIcon.textContent = '×';
                        spanIcon.className = 'text-[14px] text-emerald-700 dark:text-emerald-300';
                    }
                });

                return btn;
            }

            function renderColumns(df1Columns, df2Columns) {
                columns1Container.innerHTML = '';
                columns2Container.innerHTML = '';

                df1Columns.forEach(col => {
                    columns1Container.appendChild(createTag(col));
                });

                df2Columns.forEach(col => {
                    columns2Container.appendChild(createTag(col));
                });
            }

            function renderPreviewTable(columns, rows) {
                previewThead.innerHTML = '';
                previewTbody.innerHTML = '';

                const trHead = document.createElement('tr');
                if (!columns || columns.length === 0) {
                    const th = document.createElement('th');
                    th.className = 'px-3 py-2 font-semibold';
                    th.textContent = 'No data';
                    trHead.appendChild(th);
                } else {
                    columns.forEach(name => {
                        const th = document.createElement('th');
                        th.className = 'px-3 py-2 font-semibold';
                        th.textContent = name;
                        trHead.appendChild(th);
                    });
                }
                previewThead.appendChild(trHead);

                if (!rows || rows.length === 0) {
                    const tr = document.createElement('tr');
                    const td = document.createElement('td');
                    td.className = 'px-3 py-5 text-center text-[11px] text-gray-400 dark:text-gray-500';
                    td.colSpan = Math.max(columns.length, 1);
                    td.textContent = 'Hali mosliklar topilmadi.';
                    tr.appendChild(td);
                    previewTbody.appendChild(tr);
                } else {
                    rows.forEach(row => {
                        const tr = document.createElement('tr');
                        tr.className = 'hover:bg-emerald-50/40 dark:hover:bg-emerald-500/5 transition';
                        row.forEach((value, index) => {
                            const td = document.createElement('td');
                            td.className = 'px-3 py-2 ' + (index === row.length - 1 ? 'text-right' : '');
                            td.textContent = value;
                            tr.appendChild(td);
                        });
                        previewTbody.appendChild(tr);
                    });
                }

                hasPreview = true;
                downloadBtn.disabled = !currentCsvName;
            }

            function collectSelectedColumns(container) {
                const selected = [];
                container.querySelectorAll('.tag-chip[data-selected="true"]').forEach(btn => {
                    const labelSpan = btn.querySelector('span');
                    if (labelSpan) {
                        selected.push(labelSpan.textContent);
                    }
                });
                return selected;
            }

            fileInput1.addEventListener('change', () => {
                fileLabel1.textContent = fileInput1.files && fileInput1.files[0] ? fileInput1.files[0].name : 'Hali tanlanmagan';
                updateAnalysisButtonState();
            });

            fileInput2.addEventListener('change', () => {
                fileLabel2.textContent = fileInput2.files && fileInput2.files[0] ? fileInput2.files[0].name : 'Hali tanlanmagan';
                updateAnalysisButtonState();
            });

            analysisBtn.addEventListener('click', () => {
                if (!fileInput1.files.length || !fileInput2.files.length) {
                    return;
                }

                const formData = new FormData();
                formData.append('df1', fileInput1.files[0]);
                formData.append('df2', fileInput2.files[0]);

                analysisBtn.disabled = true;
                analysisSpinner.classList.remove('hidden');
                analysisText.textContent = 'Analysing...';
                submitBtn.disabled = true;

                fetch(uploadUrl, {
                    method: 'POST',
                    body: formData,
                })
                    .then(res => {
                        if (!res.ok) {
                            throw new Error('Upload failed');
                        }
                        return res.json();
                    })
                    .then(data => {
                        df1Name = data.df1_name;
                        df2Name = data.df2_name;
                        renderColumns(data.df1_columns || [], data.df2_columns || []);
                        hasAnalysis = true;
                        submitBtn.disabled = false;
                    })
                    .catch(err => {
                        console.error(err);
                        alert('Analysis failed. Please try again.');
                    })
                    .finally(() => {
                        analysisSpinner.classList.add('hidden');
                        analysisText.textContent = 'Analysis';
                        updateAnalysisButtonState();
                    });
            });

            submitBtn.addEventListener('click', () => {
                if (!hasAnalysis) {
                    return;
                }
                submitBtn.disabled = true;
                submitText.textContent = 'Executing...';

                const df1Columns = collectSelectedColumns(columns1Container);
                const df2Columns = collectSelectedColumns(columns2Container);

                const thresholdBtn = document.querySelector('[data-group="threshold"] .option-chip[data-selected="true"]');
                const joinTypeBtn = document.querySelector('[data-group="join-type"] .option-chip[data-selected="true"]');

                const payload = {
                    df1_name: df1Name,
                    df2_name: df2Name,
                    df1_columns: df1Columns,
                    df2_columns: df2Columns,
                    threshold: thresholdBtn ? thresholdBtn.getAttribute('data-value') : '0.75',
                    join_type: joinTypeBtn ? joinTypeBtn.getAttribute('data-value') : 'inner',
                };

                fetch(runJoinUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload),
                })
                    .then(res => {
                        if (!res.ok) {
                            throw new Error('Join failed');
                        }
                        return res.json();
                    })
                    .then(data => {
                        currentCsvName = data.csv_name || null;
                        renderPreviewTable(data.columns || [], data.rows || []);
                    })
                    .catch(err => {
                        console.error(err);
                        alert('Join failed. Please try again.');
                    })
                    .finally(() => {
                        submitBtn.disabled = false;
                        submitText.textContent = 'Submit';
                    });
            });

            downloadBtn.addEventListener('click', () => {
                if (!hasPreview) {
                    return;
                }
                if (!currentCsvName) {
                    return;
                }

                const downloadUrl = '/media/smart_join/' + encodeURIComponent(currentCsvName);
                window.location.href = downloadUrl;
            });

            // Option chips (threshold & join type)
            document.querySelectorAll('.option-chip').forEach(btn => {
                btn.classList.add('inline-flex', 'items-center', 'justify-center', 'rounded-full', 'border', 'border-gray-200', 'dark:border-gray-800', 'px-3', 'py-1.5', 'text-[11px]', 'font-medium', 'text-gray-700', 'dark:text-gray-200', 'bg-white/80', 'dark:bg-gray-900/70', 'hover:border-emerald-400', 'hover:bg-emerald-50/70', 'dark:hover:bg-emerald-500/10', 'transition');
                if (btn.classList.contains('is-selected')) {
                    btn.classList.remove('is-selected');
                    btn.classList.add('bg-emerald-500/10', 'border-emerald-400', 'text-emerald-700', 'dark:text-emerald-300');
                    btn.setAttribute('data-selected', 'true');
                } else {
                    btn.setAttribute('data-selected', 'false');
                }

                btn.addEventListener('click', () => {
                    const group = btn.parentElement?.getAttribute('data-group');
                    if (group) {
                        btn.parentElement.querySelectorAll('.option-chip').forEach(sibling => {
                            sibling.setAttribute('data-selected', 'false');
                            sibling.classList.remove('bg-emerald-500/10', 'border-emerald-400', 'text-emerald-700', 'dark:text-emerald-300');
                            sibling.classList.add('border-gray-200', 'dark:border-gray-800', 'bg-white/80', 'dark:bg-gray-900/70');
                        });
                    }

                    btn.setAttribute('data-selected', 'true');
                    btn.classList.remove('border-gray-200', 'dark:border-gray-800', 'bg-white/80', 'dark:bg-gray-900/70');
                    btn.classList.add('bg-emerald-500/10', 'border-emerald-400', 'text-emerald-700', 'dark:text-emerald-300');
                });
            });
        })();
    </script>
</div>
{% endblock %}
